server:
  port: ${BACKEND_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: ai-finance-controller-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aifinance}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres_password_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Custom Application Configurations
ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    root: INFO
    com.razorpay.aifinance: DEBUG

app:
  data:
    path: ${DATA_PATH:../data}
